<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaseFlow - Patient Database</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>

<!-- The navigation bar to navigate back to the home page (current page) -->
 <!-- NOTE: incorporate functionality like a link to click -->
 <header class="navbar">
    <h1>CaseFlow</h1>
 </header>

 <main class="container">
    
    <!-- Title, the button to add a new patient -->
     <div class="header-bar">
        <div>
            <h2>Patient database</h2>
            <p>Incomplete records are listed first </p>
        </div>
        <!-- Button that leads to the screen to add a patient-->
        <a href="/add-patient" class="btn-add">+Add new patient</a>
     </div>

     <!-- Summarising statistics -->
          <!-- NOTE: Placeholder value is displayed for now -->
     <section class="cards-grid">
        <div class="card">
            <div class="card-title">Total Patients</div>
            <div class="card-value">6</div>
        </div>
        <div class="card">
            <div class="card-title">In Progress</div>
            <div class="card-value">4</div>
        </div>
        <div class="card">
            <div class="card-title">Completed</div>
            <div class="card-value">2</div>
        </div>
     </section>

     <!-- Window that displays the table in a scroll-able format-->
     <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Patient ID</th>
                    <th>Name</th>
                    <th>Surname</th>
                    <th>Progress</th>
                    <th>Report status</th>
                </tr>
            </thead>
            <tbody>
                <!-- before the use of flask and databases, static sample data is displayed -->
                <tr>
                    <td>1</td>
                    <td>John</td>
                    <td>Doe</td>
                    <td>25%</td>
                    <td>Incomplete</td>
            </tbody>
        </table>
     </div>
 </main>
</body>
</html>
